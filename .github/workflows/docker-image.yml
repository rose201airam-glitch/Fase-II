name: Validacion Docker Tecmilenio

on:
  push:
    branches: [principal]
  pull_request:
    branches: [principal]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build \
            -t tecmilenio-fase2:latest \
            -f FASE_II_Proyecto_IA_Tecmilenio/Dockerfile \
            FASE_II_Proyecto_IA_Tecmilenio
          
