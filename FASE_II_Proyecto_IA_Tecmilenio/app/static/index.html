<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente financiero - demo</title><style>body{font-family:Arial,sans-serif;max-width:750px;margin:50px auto;padding:0 18px;color:#182a37}main{border:1px solid #ddd;border-radius:12px;padding:24px}input{width:75%;padding:12px}button{padding:12px;background:#006c77;color:white;border:0;border-radius:5px}#result{white-space:pre-wrap;margin-top:20px;line-height:1.5}</style></head><body><main><h1>Asistente de atención financiera</h1><p>Prototipo académico de preguntas frecuentes; no utiliza un modelo generativo ni datos reales.</p><form id="form"><label for="question">Escribe tu consulta</label><br><input id="question" maxlength="500" required placeholder="¿Cómo consulto mi estado de cuenta?"><button>Consultar</button></form><div id="result" role="status"></div></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const result=document.getElementById('result');result.textContent='Consultando...';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.getElementById('question').value})});const data=await response.json();result.textContent=response.ok?data.answer+'\nFuente: '+data.source+'\nEscalar: '+(data.escalate?'Sí':'No'):'Error: '+JSON.stringify(data.detail)}catch(err){result.textContent='No se pudo conectar con el servidor.'}})</script></body></html>
